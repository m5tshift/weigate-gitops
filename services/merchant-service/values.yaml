# merchant-service on the minimal stand (SRS 6.4); merged over charts/merchant-service/values.yaml of weigate.
image:
  repository: ghcr.io/m5tshift/weigate/merchant-service
  # Updated by CI of weigate after the image build; not edited by hand.
  tag: "9c4b2af"

# SRS 6.4: one replica of every component; a PDB of one replica would block the drain of the only worker.
replicaCount: 1

# Sidecar in every pod of apps (SRS 4.1.10): with mTLS STRICT a pod without it can neither call nor be called.
podLabels:
  sidecar.istio.io/inject: "true"

# The istio agent merges /metrics of the app into :15020/stats/prometheus, which the OTel Collector scrapes outside
# mTLS STRICT (platform/observability/config/monitors.yaml, SRS 4.5.1).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: /metrics

pdb:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Traces go to the OTel Collector over OTLP/HTTP; metrics are scraped from /metrics (the collector drops OTLP metrics).
telemetry:
  otlpEndpoint: "http://otel-collector.kube-system:4318"
  traceSampleRatio: 0.5

kafka:
  enabled: true
  brokers:
    - weigate-kafka-bootstrap.kafka.svc:9092

# Secrets in apps made by the stand secrets script (weigate infra/stand-secrets): merchant-service-postgres
# (password of the CNPG owner merchant-service) and merchant-service-jwt-signing (private.pem).
secrets:
  - name: postgres
  - name: jwt-signing

postgres:
  enabled: true
  url: postgres://merchant-service@merchant-pg-rw.data.svc:5432/merchant
  password:
    secret: postgres
    key: password

env:
  JWT_SIGNING_KEY_FILE: /var/run/secrets/weigate/jwt-signing/private.pem
  JWT_ISSUER: weigate-merchant-service
  # SRS 4.1.10: JWT lifetime 15 min, rotation grace period 24 h, at most two active API keys.
  JWT_TTL: 15m
  JWKS_MAX_AGE: 5m
  API_KEY_ROTATION_GRACE: 24h
  API_KEY_MAX_ACTIVE: "2"
  # SRS 4.1.4: payment tolerance 0..5 %, 1 % by default (basis points).
  TOLERANCE_DEFAULT_BPS: "100"
  TOLERANCE_MAX_BPS: "500"
  LOG_LEVEL: info
