# payer-sim on the minimal stand (SRS 6.4); merged over charts/payer-sim/values.yaml of weigate.
image:
  repository: ghcr.io/m5tshift/weigate/payer-sim
  # Updated by CI of weigate after the image build; not edited by hand.
  tag: "edbc526"

# Signed transactions and nonces live in memory, so one replica; no PDB.
replicaCount: 1

# Sidecar in every pod of apps (SRS 4.1.10): with mTLS STRICT a pod without it can neither call nor be called.
podLabels:
  sidecar.istio.io/inject: "true"

# The istio agent merges /metrics of the app into :15020/stats/prometheus, which the OTel Collector scrapes outside
# mTLS STRICT (platform/observability/config/monitors.yaml, SRS 4.5.1).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: /metrics

pdb:
  enabled: false

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Traces go to the OTel Collector over OTLP/HTTP; metrics are scraped from /metrics (the collector drops OTLP metrics).
telemetry:
  otlpEndpoint: "http://otel-collector.kube-system:4318"
  traceSampleRatio: 0.5

# Secret in apps made by the stand secrets script (weigate infra/stand-secrets): payer-sim-payer-keys,
# keys of the Anvil accounts derived from the same mnemonic as anvil-mnemonic in chain.
secrets:
  - name: payer-keys

env:
  INVOICE_SERVICE_URL: http://invoice-service.apps.svc:8080
  # Anvil in chain (SRS 6.4).
  ANVIL_RPC_URL: http://anvil.chain.svc:8545
  PAYER_KEYS_FILE: /var/run/secrets/weigate/payer-keys/keys
  # Shares of invoices: paid in full, underpaid, not paid (SRS 8.1); they sum to 100.
  PAY_PERCENT: "80"
  UNDERPAY_PERCENT: "10"
  SKIP_PERCENT: "10"
  UNDERPAY_BPS: "5000"
  LOG_LEVEL: info
