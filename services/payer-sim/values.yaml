# payer-sim on the minimal stand (SRS 6.4); merged over charts/payer-sim/values.yaml of slopay.
image:
  repository: ghcr.io/m5tshift/slopay/payer-sim
  # Updated by CI of slopay after the image build; not edited by hand.
  tag: "09a576e"

# Signed transactions and nonces live in memory, so one replica; no PDB.
replicaCount: 1
pdb:
  enabled: false

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

# No observability on the minimal stand: an empty endpoint turns the OTLP export off.
telemetry:
  otlpEndpoint: ""

# Secret in apps made by the stand secrets script (slopay infra/stand-secrets): payer-sim-payer-keys,
# keys of the Anvil accounts derived from the same mnemonic as anvil-mnemonic in chain.
secrets:
  - name: payer-keys

env:
  INVOICE_SERVICE_URL: http://invoice-service.apps.svc:8080
  # Anvil in chain (SRS 6.4).
  ANVIL_RPC_URL: http://anvil.chain.svc:8545
  PAYER_KEYS_FILE: /var/run/secrets/slopay/payer-keys/keys
  # Shares of invoices: paid in full, underpaid, not paid (SRS 8.1); they sum to 100.
  PAY_PERCENT: "80"
  UNDERPAY_PERCENT: "10"
  SKIP_PERCENT: "10"
  UNDERPAY_BPS: "5000"
  LOG_LEVEL: info
