# Full stand overlay of rate-service (SRS 4.1.9, 6.2, 6.3, INF-2.4), applied over values.yaml.
image:
  repository: zot.registry.svc:5000/weigate/rate-service

# SRS 6.3: two replicas (active-standby poller via Kubernetes Lease), one may be drained at a time.
replicaCount: 2
pdb:
  enabled: true
  minAvailable: 1

# Password of Valkey ACL user rate-service (OpenBao valkey/users).
secrets:
  - name: valkey
    externalSecret:
      enabled: true
      data:
        - secretKey: password
          remoteRef:
            key: valkey/users
            property: rate-service

# invoice-service -> rate-service (SRS 4.1.9): outlier detection, timeout 500 ms, one retry; no fault injection.
# rate-service answers 503 on purpose when the sources diverge or the rate is stale (SRS 4.1.3), so a 5xx answer does
# not eject a pod: only gateway errors (502, 503 and 504 of the proxy, connection failures) count.
istio:
  destinationRule:
    enabled: true
    outlierDetection:
      consecutive5xxErrors: 0
      consecutiveGatewayErrors: 5
  virtualService:
    enabled: true
    timeout: 500ms
    retries:
      attempts: 1
      perTryTimeout: 500ms
    fault:
      enabled: false
