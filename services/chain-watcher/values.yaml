# chain-watcher on the minimal stand (SRS 6.4); merged over charts/chain-watcher/values.yaml of weigate.
image:
  repository: ghcr.io/m5tshift/weigate/chain-watcher
  # Updated by CI of weigate after the image build; not edited by hand.
  tag: "d740392"

# SRS 6.4: one replica of every component; a PDB of one replica would block the drain of the only worker.
# The single replica takes the Lease and reads blocks (SRS 4.1.3).
replicaCount: 1

# Sidecar in every pod of apps (SRS 4.1.10): with mTLS STRICT a pod without it can neither call nor be called.
podLabels:
  sidecar.istio.io/inject: "true"

# The istio agent merges /metrics of the app into :15020/stats/prometheus, which the OTel Collector scrapes outside
# mTLS STRICT (platform/observability/config/monitors.yaml, SRS 4.5.1).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: /metrics

pdb:
  enabled: false
leader:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

# Traces go to the OTel Collector over OTLP/HTTP; metrics are scraped from /metrics (the collector drops OTLP metrics).
telemetry:
  otlpEndpoint: "http://otel-collector.kube-system:4318"
  traceSampleRatio: 0.5

kafka:
  enabled: true
  brokers:
    - weigate-kafka-bootstrap.kafka.svc:9092

# Secrets in apps made by the stand secrets script (weigate infra/stand-secrets): chain-watcher-mongodb
# (the same password as mongodb-users in data) and chain-watcher-valkey (ACL user chain-watcher).
secrets:
  - name: mongodb
  - name: valkey

# PerconaServerMongoDB mongodb in data, replica set rs0 of one member; the user lives in chain_watcher.
mongodb:
  enabled: true
  uri: mongodb://mongodb-rs0.data.svc:27017/?replicaSet=rs0
  username: chain-watcher
  database: chain_watcher
  authSource: chain_watcher
  password:
    secret: mongodb
    key: password

valkey:
  enabled: true
  addrs:
    - valkey.data.svc:6379
  username: chain-watcher
  password:
    secret: valkey
    key: password

env:
  KAFKA_CONSUMER_GROUP: chain-watcher
  # Anvil in chain (SRS 6.4).
  NODE_URL: http://anvil.chain.svc:8545
  CHAIN_ID: "31337"
  NODE_TIMEOUT: 5s
  NODE_BREAKER_FAILURE_THRESHOLD: "5"
  NODE_BREAKER_OPEN_TIMEOUT: 15s
  NODE_BREAKER_HALF_OPEN_MAX: "1"
  BACKOFF_INITIAL: 500ms
  BACKOFF_MAX: 30s
  POLL_INTERVAL: 1s
  # SRS 4.1.6: window of the last 64 headers; 4.1.9: reorgs up to 6 blocks.
  WINDOW_SIZE: "64"
  REORG_MAX_DEPTH: "6"
  # SRS 4.1.7: an address is tracked 24 h; the projection is rebuilt from 26 h of invoice.events.
  TRACKING_WINDOW: 24h
  PROJECTION_REBUILD_WINDOW: 26h
  RESCAN_CLOCK_SKEW: 30s
  VALKEY_TIMEOUT: 100ms
  LOG_LEVEL: info
