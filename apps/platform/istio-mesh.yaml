# Wave 3: Gateway API Gateway and HTTPRoutes, PROXY protocol, mesh-wide mTLS STRICT, JWT check on the gateway
# (SRS 4.1.8, 4.1.10). Needs the Istio and Gateway API CRDs (wave 1), istiod (wave 2) and the Secret
# weigate-gateway-tls from cert-manager-issuers (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: weigate
  source:
    repoURL: https://github.com/m5tshift/weigate-gitops
    targetRevision: main
    path: platform/istio/mesh
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
