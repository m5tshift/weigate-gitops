# Wave 3: kube-state-metrics, scraped through its ServiceMonitor (SRS 4.5.3). Chart kube-state-metrics 9.0.1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: weigate
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 9.0.1
      helm:
        releaseName: kube-state-metrics
        valueFiles:
          - $values/platform/observability/kube-state-metrics/values.yaml
    - repoURL: https://github.com/m5tshift/weigate-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
