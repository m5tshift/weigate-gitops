# Wave 1: Percona Operator for MongoDB (SRS 4.1.6, 6.4). Upstream chart psmdb-operator 1.23.2 (operator 1.23.1).
# Runs in data and watches only it: the namespace is created by bootstrap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: percona-mongodb-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: weigate
  sources:
    - repoURL: https://percona.github.io/percona-helm-charts/
      chart: psmdb-operator
      targetRevision: 1.23.2
      helm:
        releaseName: psmdb-operator
        valueFiles:
          - $values/platform/percona-mongodb/operator/values.yaml
    - repoURL: https://github.com/m5tshift/weigate-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
