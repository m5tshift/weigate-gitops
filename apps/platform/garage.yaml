# Wave 2: Garage S3 for PostgreSQL and MongoDB backups and Tempo traces (SRS INF-1.3, 4.1.6).
# Placed in wave 2 so Percona MongoDB PBM and CNPG backups (wave 2) do not deadlock waiting for wave 3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: weigate
  source:
    repoURL: https://github.com/m5tshift/weigate-gitops
    targetRevision: main
    path: platform/garage
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
