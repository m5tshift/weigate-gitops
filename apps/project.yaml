# Project for all platform and service Applications. Wave -1: exists before any Application that uses it.
# Wave plan for child Applications:
#   0 local-path-provisioner | 1 operators (strimzi, cnpg, percona, cert-manager, openbao, external-secrets), gateway-api-crds, istio-base
#   1 also observability-crds (ServiceMonitor, PodMonitor), karpenter, kwok
#   2 operator CRs (kafka, clusters, mongodb, cert-manager issuers, openbao-store), istiod, istio-cni, karpenter-config, kwok-stages
#   3 valkey, anvil, rate-mock, merchant-mock, payer-sim, istio-gateway, istio-mesh, observability storage (victoria-metrics, victoria-logs),
#     kube-state-metrics, observability-config
#   4 merchant-service, invoice-service, chain-watcher, rate-service, tempo, grafana, vmalert, otel-target-allocator, otel-collector
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: weigate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Weigate platform and services
  sourceRepos:
    - https://github.com/m5tshift/weigate-gitops
    - https://github.com/m5tshift/weigate
    - https://github.com/rancher/local-path-provisioner
    - https://strimzi.io/charts/
    - https://cloudnative-pg.github.io/charts
    - https://percona.github.io/percona-helm-charts/
    - https://charts.jetstack.io
    - https://istio-release.storage.googleapis.com/charts
    - https://github.com/kubernetes-sigs/gateway-api
    - https://openbao.github.io/openbao-helm
    - https://charts.external-secrets.io
    - https://prometheus-community.github.io/helm-charts
    - https://victoriametrics.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - ghcr.io/actions/actions-runner-controller-charts
    - https://github.com/kubernetes-sigs/karpenter
    - https://kwok.sigs.k8s.io/charts/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: local-path-storage
    - server: https://kubernetes.default.svc
      namespace: kafka
    - server: https://kubernetes.default.svc
      namespace: data
    - server: https://kubernetes.default.svc
      namespace: chain
    - server: https://kubernetes.default.svc
      namespace: secrets
    - server: https://kubernetes.default.svc
      namespace: apps
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: ci
    - server: https://kubernetes.default.svc
      namespace: registry
    - server: https://kubernetes.default.svc
      namespace: karpenter
    # istio-cni and the OTel Collector: their DaemonSets with hostPath need the Pod Security exemption Talos gives kube-system.
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    # Gateway API CRDs ship a policy that blocks installing experimental CRDs over standard ones.
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: external-secrets.io
      kind: ClusterSecretStore
    # Karpenter with the KWOK provider: pools and node classes; KWOK lifecycle Stages; the chart of KWOK adds a FlowSchema.
    - group: karpenter.sh
      kind: NodePool
    - group: karpenter.sh
      kind: NodeClaim
    - group: karpenter.kwok.sh
      kind: KWOKNodeClass
    - group: kwok.x-k8s.io
      kind: Stage
    - group: flowcontrol.apiserver.k8s.io
      kind: FlowSchema
