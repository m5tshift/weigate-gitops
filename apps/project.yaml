# Project for all platform and service Applications. Wave -1: exists before any Application that uses it.
# Wave plan for child Applications:
#   0 local-path-provisioner | 1 operators (strimzi, cnpg, percona) | 2 operator CRs (kafka, clusters, mongodb)
#   3 valkey, anvil, rate-mock, payer-sim | 4 merchant-service, invoice-service, chain-watcher, rate-service
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: weigate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Weigate platform and services
  sourceRepos:
    - https://github.com/m5tshift/weigate-gitops
    - https://github.com/m5tshift/weigate
    - https://github.com/rancher/local-path-provisioner
    - https://strimzi.io/charts/
    - https://cloudnative-pg.github.io/charts
    - https://percona.github.io/percona-helm-charts/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: local-path-storage
    - server: https://kubernetes.default.svc
      namespace: kafka
    - server: https://kubernetes.default.svc
      namespace: data
    - server: https://kubernetes.default.svc
      namespace: chain
    - server: https://kubernetes.default.svc
      namespace: apps
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: storage.k8s.io
      kind: StorageClass
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
