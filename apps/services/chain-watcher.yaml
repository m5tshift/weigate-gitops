# Wave 4: chain-watcher, reads EVM blocks and publishes chain.* events (SRS 4.1.3).
# Full stand (SRS 6.3): the chart comes from Zot (SRS CI-5.3), values from here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chain-watcher
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: weigate
  sources:
    - repoURL: zot.registry.svc:5000/weigate/charts
      chart: chain-watcher
      targetRevision: 0.2.2
      helm:
        releaseName: chain-watcher
        valueFiles:
          - $values/services/chain-watcher/values.yaml
          - $values/services/chain-watcher/values-full.yaml
    - repoURL: https://github.com/m5tshift/weigate-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
