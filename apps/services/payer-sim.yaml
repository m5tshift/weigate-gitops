# Wave 3: payer-sim, the simulated payer: pays invoices with ETH in Anvil (SRS 4.1.3).
# Full stand (SRS 6.3): the chart comes from Zot (SRS CI-5.3), values from here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payer-sim
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: weigate
  sources:
    - repoURL: zot.registry.svc:5000/weigate/charts
      chart: payer-sim
      targetRevision: 0.1.2
      helm:
        releaseName: payer-sim
        valueFiles:
          - $values/services/payer-sim/values.yaml
          - $values/services/payer-sim/values-full.yaml
    - repoURL: https://github.com/m5tshift/weigate-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
