# Passwords of the ClickHouse users ddl and reporting from OpenBao (clickhouse/users).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-users
  namespace: data
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: clickhouse-users
  data:
    - secretKey: ddl
      remoteRef:
        key: clickhouse/users
        property: ddl
    - secretKey: reporting
      remoteRef:
        key: clickhouse/users
        property: reporting
