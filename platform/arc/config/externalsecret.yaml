# Value lives in OpenBao: ci/github (github_token, a fine-grained PAT for m5tshift/weigate).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: arc-github
  dataFrom:
    - extract:
        key: ci/github
