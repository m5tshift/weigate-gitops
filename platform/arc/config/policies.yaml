# Runner pods: the only way out is GitHub, the Go module proxy and Zot (SRS 4.1.11). Ingress is closed by the default-deny of
# platform/network-policies.
# *.blob.core.windows.net is where GitHub keeps job logs, artifacts and cache.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: runners
spec:
  endpointSelector:
    matchLabels:
      actions.github.com/scale-set-name: arc-runners
      app.kubernetes.io/component: runner
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: proxy.golang.org
        - matchName: sum.golang.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: registry
            app.kubernetes.io/name: zot
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
---
# Controller and listener: GitHub and the API server.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: NotIn
        values: [runner]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchPattern: "*.actions.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
