# Demo workload: Karpenter adds simulated nodes for it, and removes them when the replicas go down.
# The only workload with the toleration of the simulated nodes. Replicas change through git: self-heal reverts kubectl scale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwok-demo
  labels:
    app.kubernetes.io/name: kwok-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kwok-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kwok-demo
    spec:
      nodeSelector:
        weigate.io/simulated: "true"
      tolerations:
        - key: weigate.io/simulated
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
