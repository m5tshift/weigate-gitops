# Values for the kwok/charts chart of kubernetes-sigs/karpenter v1.15.1 (SRS INF-1.2, ADR 0006).
# Full stand (SRS 6.3): two replicas behind the built-in PodDisruptionBudget (maxUnavailable 1).
replicas: 2

# Upstream kwok/charts v1.15.1 leaves staticCapacity and capacityBuffer unset, rendering invalid empty booleans in FEATURE_GATES.
settings:
  featureGates:
    staticCapacity: false
    capacityBuffer: false

controller:
  image:
    repository: ghcr.io/m5tshift/weigate/karpenter-kwok/kwok
    tag: v1.15.1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
