# Passwords of the MongoDB users of the three services (OpenBao mongodb/users).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-users
  namespace: data
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mongodb-users
  data:
    - secretKey: chain-watcher
      remoteRef:
        key: mongodb/users
        property: chain-watcher
    - secretKey: webhook-service
      remoteRef:
        key: mongodb/users
        property: webhook-service
    - secretKey: reconciliation-service
      remoteRef:
        key: mongodb/users
        property: reconciliation-service
---
# Keys of the Garage bucket mongo-backups from OpenBao (garage/keys, platform/garage/README.md) for PBM.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-backup-s3
  namespace: data
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: mongodb-backup-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: garage/keys
        property: mongo-backups-access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: garage/keys
        property: mongo-backups-secret-key
