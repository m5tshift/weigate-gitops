# KV v2 mount "secret"; the role external-secrets and the kubernetes auth mount are created by Terraform phase 2.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.secrets.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: secrets
---
# Database secrets engine mount "database" for rotated static PostgreSQL roles (SRS INF-2.4); version v1 matches
# the flat response of database/static-creds/<role>.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-database
spec:
  provider:
    vault:
      server: http://openbao.secrets.svc:8200
      path: database
      version: v1
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: secrets
