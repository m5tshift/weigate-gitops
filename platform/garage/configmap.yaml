apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  labels:
    app.kubernetes.io/name: garage
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/data"
    db_engine = "lmdb"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_secret_file = "/secrets/rpc-secret"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/secrets/admin-token"
