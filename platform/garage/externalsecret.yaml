# Values live in OpenBao: garage/core (rpc-secret, admin-token) and garage/keys (<bucket>-access-key, <bucket>-secret-key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garage-secrets
  dataFrom:
    - extract:
        key: garage/core
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-keys
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garage-keys
  dataFrom:
    - extract:
        key: garage/keys
