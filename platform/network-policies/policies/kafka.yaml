# Namespace kafka: Strimzi operator and the cluster weigate. The policies generated by Strimzi only add allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default
  namespace: kafka
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            app.kubernetes.io/name: opentelemetry-collector
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - {}
    # Cluster operator and entity operator.
    - toEntities:
        - kube-apiserver
---
# Brokers: producers and consumers of SRS 4.1.3 and the Kafka engine of ClickHouse.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: brokers
  namespace: kafka
spec:
  endpointSelector:
    matchLabels:
      strimzi.io/cluster: weigate
      strimzi.io/broker-role: "true"
  ingress:
    - fromEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [apps]
            - key: app.kubernetes.io/name
              operator: In
              values: [merchant-service, invoice-service, chain-watcher, rate-service, webhook-service, ledger-service, reconciliation-service]
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: data
            clickhouse.altinity.com/chi: weigate
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
