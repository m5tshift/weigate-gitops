# Valkey password for Envoy RLS from OpenBao (valkey/users, property envoy-rls).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-rls-valkey
  namespace: istio-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: envoy-rls-valkey
  data:
    - secretKey: password
      remoteRef:
        key: valkey/users
        property: envoy-rls
