# Envoy rate limit service on Valkey (SRS 4.1.7, 4.1.8). One replica on the minimal stand (SRS 6.4).
# The Valkey password comes from the Secret envoy-rls-valkey (stand secrets script, later ESO). No sidecar:
# the gateway calls the service over plain gRPC inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-rls
  namespace: istio-system
  labels:
    app.kubernetes.io/name: envoy-rls
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy-rls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envoy-rls
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ratelimit
          image: envoyproxy/ratelimit:a7a61514@sha256:0277b070ac7c1856d7bf430cecc413d84d7cb2023443e8560aaa12d30aba6e55
          command: ["/bin/ratelimit"]
          env:
            - name: USE_STATSD
              value: "false"
            - name: LOG_LEVEL
              value: warn
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: valkey.data.svc.cluster.local:6379
            - name: REDIS_USER
              value: envoy-rls
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: envoy-rls-valkey
                  key: password
            - name: REDIS_AUTH
              value: $(REDIS_USER):$(REDIS_PASSWORD)
            - name: CACHE_KEY_PREFIX
              value: "ratelimit:"
          ports:
            - name: grpc
              containerPort: 8081
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-rls-config
