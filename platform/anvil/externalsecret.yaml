# Anvil BIP-39 mnemonic from OpenBao (anvil/mnemonic, field mnemonic).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anvil-mnemonic
  namespace: chain
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: anvil-mnemonic
  data:
    - secretKey: mnemonic
      remoteRef:
        key: anvil/mnemonic
        property: mnemonic
