# NodePort 30500 equals zot_endpoint of the Terraform talos layer (SRS INF-1.4).
apiVersion: v1
kind: Service
metadata:
  name: zot
  labels:
    app.kubernetes.io/name: zot
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: zot
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
