# Values for the upstream local-path-provisioner chart (SRS INF-1.3, 6.4).
# Data disk of talos-w-1 is the UserVolumeConfig "data", mounted at /var/mnt/data (infra/talos in weigate).
replicaCount: 1

helperImage:
  repository: docker.io/library/busybox
  tag: "1.37.0"

storageClass:
  create: true
  defaultClass: true
  name: local-path
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer

nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
      - /var/mnt/data/local-path

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

helperPod:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 32Mi
