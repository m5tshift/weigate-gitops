# Values for victoria-metrics-single (SRS 4.5.2, 6.2). Service victoria-metrics.observability:8428; written by the
# OTel Collector (remote write) and vmalert.
server:
  fullnameOverride: victoria-metrics
  # Retention is cut before scaling anything else down (SRS 6.2, load shedding step 2).
  retentionPeriod: 7d
  persistentVolume:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 448Mi
