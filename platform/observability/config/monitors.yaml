# Scrape targets of the OTel Collector, read by the OTel Target Allocator (SRS 4.5.1, 4.5.3).
# Pods with a sidecar: mTLS STRICT rejects plaintext scrapes of the application port, so the merged endpoint of the
# istio agent is read instead (:15020/stats/prometheus, outside mTLS). It serves Envoy and agent metrics and, for pods
# with prometheus.io/port and prometheus.io/path annotations, the application metrics too.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-proxies
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      security.istio.io/tlsMode: istio
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: $1:15020
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
spec:
  namespaceSelector:
    matchNames: [istio-system]
  selector:
    matchLabels:
      app: istiod
  endpoints:
    - port: http-monitoring
      interval: 30s
---
# Kafka brokers (JMX Exporter) and Kafka Exporter: both are Strimzi pods of kind Kafka with port tcp-prometheus.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: strimzi-kafka
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchLabels:
      strimzi.io/kind: Kafka
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: strimzi-cluster-operator
spec:
  namespaceSelector:
    matchNames: [kafka]
  selector:
    matchLabels:
      strimzi.io/kind: cluster-operator
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# Cilium agent and Hubble metrics; enabled in infra/terraform/platform/cilium.tf of weigate (full stand only).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-agent
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: cilium
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
    - port: hubble-metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-operator
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      io.cilium/app: operator
  podMetricsEndpoints:
    - port: prometheus
      interval: 30s
---
# Tempo built-in metrics (/metrics on :3200) for the Traces dashboard; exclude tempo-headless to avoid duplicates.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo
spec:
  namespaceSelector:
    matchNames: [observability]
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/instance: tempo
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: DoesNotExist
  endpoints:
    - port: tempo-prom-metrics
      path: /metrics
      interval: 30s
---
# CloudNativePG built-in Prometheus exporter (:9187/metrics on port "metrics") for merchant-pg, invoice-pg, ledger-pg.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-clusters
spec:
  namespaceSelector:
    matchNames: [data]
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
