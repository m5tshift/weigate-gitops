apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecrets.yaml
  - monitors.yaml
# Dashboards of SRS 4.5.3, provisioned by Grafana from this ConfigMap (grafana/values.yaml, dashboardsConfigMaps).
configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/golden-signals.json
      - dashboards/kafka.json
      - dashboards/gateway.json
      - dashboards/mesh.json
      - dashboards/chain.json
      - dashboards/business.json
      - dashboards/infrastructure.json
      - dashboards/traces.json
generatorOptions:
  disableNameSuffixHash: true
