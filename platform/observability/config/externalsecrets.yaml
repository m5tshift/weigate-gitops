# Secrets of the observability stack from OpenBao through the openbao ClusterSecretStore (SRS INF-2.4).
# Keys of the Garage bucket tempo-traces, created with Garage (platform/garage/README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-s3
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tempo-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: garage/keys
        property: tempo-traces-access-key
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: garage/keys
        property: tempo-traces-secret-key
---
# grafana/admin: admin-user, admin-password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
  dataFrom:
    - extract:
        key: grafana/admin
---
# alertmanager/telegram: telegram-bot-token, telegram-chat-id. Every alert goes to one Telegram chat (SRS 4.5.4).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-config
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: telegram
            group_by: [alertname]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
          receivers:
            - name: telegram
              telegram_configs:
                - bot_token: '{{ .botToken }}'
                  chat_id: {{ .chatId }}
                  send_resolved: true
  data:
    - secretKey: botToken
      remoteRef:
        key: alertmanager/telegram
        property: telegram-bot-token
    - secretKey: chatId
      remoteRef:
        key: alertmanager/telegram
        property: telegram-chat-id
