# Values for opentelemetry-collector in DaemonSet mode (SRS 4.5.1, 6.2). Services send OTLP to
# otel-collector.kube-system:4317; each collector also tails the pod logs of its node and scrapes the targets
# the Target Allocator gives it. Out: metrics to VictoriaMetrics, logs to VictoriaLogs, traces to Tempo.
mode: daemonset
fullnameOverride: otel-collector
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true
service:
  enabled: true
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
extraEnvs:
  - name: K8S_POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs: []
      target_allocator:
        endpoint: http://otel-target-allocator-ta
        interval: 30s
        collector_id: ${env:K8S_POD_NAME}
  exporters:
    prometheusremotewrite:
      endpoint: http://victoria-metrics.observability:8428/api/v1/write
    otlphttp/victorialogs:
      logs_endpoint: http://victoria-logs.observability:9428/insert/opentelemetry/v1/logs
    otlp/tempo:
      endpoint: tempo.observability:4317
      tls:
        insecure: true
  service:
    pipelines:
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/victorialogs]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 192Mi
