# Values for opentelemetry-collector in DaemonSet mode (SRS 4.5.1, 6.2). Services send OTLP/HTTP
# (traces and logs; their metrics are scraped, not pushed) to otel-collector.kube-system:4318; each collector also tails the pod logs of its node and scrapes the targets
# the Target Allocator gives it. Out: metrics to VictoriaMetrics, logs to VictoriaLogs, traces to Tempo.
mode: daemonset
fullnameOverride: otel-collector
image:
  repository: otel/opentelemetry-collector-contrib
presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true
service:
  enabled: true
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
extraEnvs:
  - name: K8S_POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["nodes/metrics"]
      verbs: ["get"]
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs: []
      target_allocator:
        endpoint: http://otel-target-allocator-ta
        interval: 30s
        collector_id: ${env:K8S_POD_NAME}
    # Volume usage for PVCAlmostFull (SRS 4.5.4): the kubelet of the own node, only kubelet_volume_stats_*.
    # The Talos kubelet certificate is self-signed.
    prometheus/kubelet:
      config:
        scrape_configs:
          - job_name: kubelet
            scheme: https
            scrape_interval: 30s
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              insecure_skip_verify: true
            static_configs:
              - targets: ["${env:K8S_NODE_IP}:10250"]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: kubelet_volume_stats_.*
                action: keep
  exporters:
    prometheusremotewrite:
      endpoint: http://victoria-metrics.observability:8428/api/v1/write
    otlphttp/victorialogs:
      logs_endpoint: http://victoria-logs.observability:9428/insert/opentelemetry/v1/logs
    otlp/tempo:
      endpoint: tempo.observability:4317
      tls:
        insecure: true
  service:
    pipelines:
      metrics:
        receivers: [otlp, prometheus, prometheus/kubelet]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/victorialogs]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 192Mi
