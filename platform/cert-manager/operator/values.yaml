# Values for the upstream cert-manager chart (SRS 4.1.10, 6.2).
crds:
  enabled: true
  keep: true

global:
  leaderElection:
    namespace: cert-manager

replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

cainjector:
  replicaCount: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

startupapicheck:
  enabled: false

prometheus:
  enabled: false
