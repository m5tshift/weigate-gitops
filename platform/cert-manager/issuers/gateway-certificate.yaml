# Used by the Istio Ingress Gateway (SRS 4.1.10); the Secret weigate-gateway-tls is created by cert-manager.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: weigate-gateway
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: weigate-gateway-tls
  dnsNames:
    - weigate.home.arpa
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - digital signature
  issuerRef:
    name: weigate-ca
    kind: ClusterIssuer
