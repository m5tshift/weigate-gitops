# Valkey ACL user passwords from OpenBao (valkey/users: invoice-service, chain-watcher, rate-service, webhook-service, envoy-rls).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-users
  namespace: data
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: valkey-users
  dataFrom:
    - extract:
        key: valkey/users
