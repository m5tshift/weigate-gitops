# invoice-service database (SRS 4.1.6, 6.4): 1 instance, no backups. Services: invoice-pg-rw.data.svc:5432.
# initdb.secret is the basic-auth Secret invoice-pg-app-credentials made by the stand secrets script.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: invoice-pg
  namespace: data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.12-minimal-bookworm@sha256:f63e6d16c4e452e63477b437b70568e1e59b2c636ba3831530022e45d1398941
  bootstrap:
    initdb:
      database: invoice
      owner: invoice-service
      secret:
        name: invoice-pg-app-credentials
  managed:
    roles:
      - name: vault-admin
        ensure: present
        login: true
        createrole: true
        # PostgreSQL 16+ requires ADMIN OPTION or SUPERUSER to ALTER ROLE on initdb-created owners.
        superuser: true
        passwordSecret:
          name: invoice-pg-vault-admin
  storage:
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
