# Keys of the Garage bucket pg-backups from OpenBao (garage/keys, platform/garage/README.md) for Barman Cloud.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-backups-s3
  namespace: data
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pg-backups-s3
    template:
      mergePolicy: Merge
      data:
        REGION: garage
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: garage/keys
        property: pg-backups-access-key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: garage/keys
        property: pg-backups-secret-key
