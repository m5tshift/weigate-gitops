# Daily base backup at 03:00 of each cluster (SRS 4.1.6); WAL is archived continuously, retention 7d is on the Cluster.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: merchant-pg-daily
  namespace: data
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: merchant-pg
---
